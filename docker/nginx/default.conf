# ============================================================
# Nginx Configuration — STIKOM Tunas Bangsa
# ============================================================
# - Port 80 → redirect ke HTTPS
# - Port 443 → serve frontend SPA + proxy /api ke PHP-FPM
# - SSL via Let's Encrypt (Certbot)
# ============================================================

# ── Rate limiting zone ───────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ── HTTP → HTTPS redirect ───────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name stikomtunasbangsa.ac.id www.stikomtunasbangsa.ac.id;

    # Certbot ACME challenge (wajib untuk verifikasi SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ───────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stikomtunasbangsa.ac.id www.stikomtunasbangsa.ac.id;

    # ── SSL certificates (Let's Encrypt) ─────────────────────
    ssl_certificate     /etc/letsencrypt/live/stikomtunasbangsa.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stikomtunasbangsa.ac.id/privkey.pem;

    # ── SSL settings ─────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security headers ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Gzip compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Client body size (upload limit) ──────────────────────
    client_max_body_size 12M;

    # ── Laravel API (/api/*) → PHP-FPM ──────────────────────
    location /api {
        limit_req zone=api_limit burst=20 nodelay;

        alias /var/www/backend/public;
        try_files $uri $uri/ @laravel;

        location ~ \.php$ {
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
            include fastcgi_params;
            fastcgi_param REQUEST_URI $request_uri;

            # Timeouts
            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 60s;
            fastcgi_read_timeout 60s;

            # Buffers
            fastcgi_buffer_size 32k;
            fastcgi_buffers 8 16k;
        }
    }

    location @laravel {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # ── Laravel storage (public files like uploaded media) ───
    location /storage {
        alias /var/www/backend/storage/app/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Static assets caching ────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        root /var/www/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Frontend SPA (catch-all) ─────────────────────────────
    location / {
        root /var/www/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Deny dotfiles (except .well-known) ───────────────────
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
