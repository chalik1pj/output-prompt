# ============================================================
# Nginx Configuration (HTTP-only, untuk initial setup sebelum SSL)
# ============================================================
# Gunakan file ini saat PERTAMA KALI deploy, sebelum Certbot
# berhasil generate sertifikat SSL. Setelah SSL aktif, ganti
# ke default.conf (yang sudah include HTTPS).
#
# Cara pakai:
#   cp docker/nginx/default-http-only.conf docker/nginx/default.conf
#   docker compose up -d nginx
#   # Jalankan certbot (lihat docs/deployment.md)
#   # Lalu kembalikan default.conf ke versi HTTPS
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name stikomtunasbangsa.ac.id www.stikomtunasbangsa.ac.id;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

    client_max_body_size 12M;

    # ── Laravel API ──────────────────────────────────────────
    location /api {
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # ── Laravel storage ──────────────────────────────────────
    location /storage {
        alias /var/www/backend/storage/app/public;
        expires 30d;
        access_log off;
    }

    # ── Static assets ────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        root /var/www/frontend;
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # ── Frontend SPA ─────────────────────────────────────────
    location / {
        root /var/www/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
