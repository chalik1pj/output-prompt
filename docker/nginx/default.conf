# ============================================================
# Nginx Configuration — STIKOM Tunas Bangsa
# ============================================================
# HTTP only (port 80). SSL ditangani oleh reverse proxy utama.
# Aplikasi di-serve di subpath /v2.
#
# Arsitektur:
#   Browser → Reverse Proxy Utama (:443, SSL)
#           → Nginx ini (:8800 → container :80)
#           → PHP-FPM / static files
# ============================================================

# ── Rate limiting zone ───────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── Security headers ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Client body size (upload limit) ──────────────────────
    client_max_body_size 12M;

    # ── Root redirect ke /v2 ─────────────────────────────────
    location = / {
        return 301 /v2;
    }

    # ── Laravel API (/v2/api/*) → PHP-FPM ────────────────────
    location /v2/api {
        limit_req zone=api_limit burst=20 nodelay;

        # BUG YANG DIPERBAIKI: `include fastcgi_params;` sebelumnya diletakkan
        # SETELAH `fastcgi_param SCRIPT_FILENAME ...` di bawah. Untuk directive
        # fastcgi_param dengan nama yang sama dalam satu location block, Nginx
        # memakai nilai yang DITULIS PALING AKHIR -- jadi include (yang di
        # dalamnya JUGA men-set SCRIPT_FILENAME via $document_root$fastcgi_script_name)
        # diam-diam MENIMPA BALIK nilai custom yang sudah benar di bawah ini.
        # Karena location block ini tidak punya `root`, $document_root kosong,
        # hasilnya PHP-FPM menerima SCRIPT_FILENAME yang salah/tidak lengkap --
        # gejalanya "No input file specified" atau 502/404 dari seluruh endpoint
        # /v2/api/*. Include sekarang dipindah ke ATAS, sebelum override custom,
        # supaya urutan akhirnya benar: default dulu, custom menimpa belakangan.
        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;

        # Strip /v2 prefix sebelum forward ke Laravel
        # /v2/api/programs → Laravel melihat /api/programs
        set $stripped_uri $request_uri;
        if ($stripped_uri ~ ^/v2(.*)$) {
            set $stripped_uri $1;
        }
        fastcgi_param REQUEST_URI $stripped_uri;

        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        # Buffers
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
    }

    # ── Laravel storage (public files like uploaded media) ───
    location /v2/storage {
        alias /var/www/backend/storage/app/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Static assets (JS/CSS/images from Vite build) ────────
    location /v2/assets {
        alias /var/www/frontend/assets;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Other static files under /v2 (favicon, etc) ──────────
    location ~* ^/v2/.*\.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|webp|avif)$ {
        root /var/www/frontend;
        rewrite ^/v2/(.*)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Frontend SPA (catch-all under /v2) ───────────────────
    location /v2 {
        alias /var/www/frontend;
        index index.html;
        try_files $uri $uri/ /v2/index.html;
    }

    # Rewrite internal: agar try_files /v2/index.html bisa resolve
    location = /v2/index.html {
        alias /var/www/frontend/index.html;
        internal;
    }

    # ── Deny dotfiles ────────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    # ── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
